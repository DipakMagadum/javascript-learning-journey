<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input and Change Events</title>
</head>
<body>

    <h1>Order Quantity</h1>

    <label for="quantity">Quantity:</label>

    <input
        type="number"
        id="quantity"
        value="1"
        min="1"
        max="10"
    >

    <p id="quantityMessage">Quantity: 1</p>

    <label for="delivery">Delivery:</label>

    <select id="delivery">
        <option value="standard">Standard Delivery</option>
        <option value="express">Express Delivery</option>
    </select>

    <p id="deliveryMessage">Standard Delivery selected.</p>

    <script src="03-InputAndChangeEvents.js"></script>
</body>
</html>
